<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Management - Admin CMS</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <h2>School CMS</h2>
      <span>ADMIN</span>
    </div>
    <nav class="admin-nav">
      <ul>
        <li><a href="/admin/index.html"><span class="nav-marker" aria-hidden="true"></span>Dashboard</a></li>
        <li><a href="/admin/settings.html"><span class="nav-marker" aria-hidden="true"></span>School Settings</a></li>
        <li><a href="/admin/pages.html"><span class="nav-marker" aria-hidden="true"></span>Pages Content</a></li>
        <li><a href="/admin/notices.html"><span class="nav-marker" aria-hidden="true"></span>Notices</a></li>
        <li><a href="/admin/events.html"><span class="nav-marker" aria-hidden="true"></span>Events</a></li>
        <li><a href="/admin/faculty.html"><span class="nav-marker" aria-hidden="true"></span>Faculty</a></li>
        <li><a href="/admin/facilities.html"><span class="nav-marker" aria-hidden="true"></span>Facilities</a></li>
        <li><a href="/admin/gallery.html" class="active"><span class="nav-marker" aria-hidden="true"></span>Gallery</a></li>
        <li><a href="/admin/enquiries.html"><span class="nav-marker" aria-hidden="true"></span>Enquiries Inbox</a></li>
      </ul>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <h1>Photo Gallery Management</h1>
      <button class="btn btn-primary" onclick="openGalleryModal()">+ Upload New Photo</button>
    </header>

    <div class="admin-content">
      <div id="gallery-alert-container"></div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h3>School Photo Gallery</h3>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Title</th>
                <th>Category</th>
                <th>Order</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="gallery-table-body">
              <tr><td colspan="6">Loading photo gallery...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal for Create / Edit Gallery Item -->
  <div class="modal-overlay" id="gallery-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="gallery-modal-title">Upload New Photo</h3>
        <button class="modal-close" onclick="closeModal('gallery-modal')">&times;</button>
      </div>

      <form id="gallery-form">
        <input type="hidden" id="gallery_id">

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
          <div class="form-group">
            <label for="gallery_title">Photo Title / Caption</label>
            <input type="text" id="gallery_title" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="gallery_category">Category</label>
            <input type="text" id="gallery_category" class="form-control" placeholder="e.g. Events, Campus" required>
          </div>
        </div>

        <div class="form-group">
          <label for="gallery_description">Description (Optional)</label>
          <textarea id="gallery_description" class="form-control" style="min-height: 70px;"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
          <div class="form-group">
            <label for="gallery_image_file">Photo File</label>
            <input type="file" id="gallery_image_file" class="form-control" accept="image/*">
            <input type="hidden" id="gallery_image_url">
            <img id="gallery-image-preview" class="upload-preview" alt="Photo Preview">
          </div>

          <div class="form-group">
            <label for="gallery_display_order">Display Order</label>
            <input type="number" id="gallery_display_order" class="form-control" value="0">
          </div>
        </div>

        <div class="form-group">
          <label for="gallery_is_active">Visibility</label>
          <select id="gallery_is_active" class="form-control">
            <option value="1">Active (Visible)</option>
            <option value="0">Hidden</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Save Photo</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let galleryData = [];

    async function loadGallery() {
      try {
        const res = await apiRequest('/admin/gallery');
        galleryData = res.data || [];
        renderGalleryTable();
      } catch (err) {
        showAlert('gallery-alert-container', 'Failed to load photo gallery.');
      }
    }

    function renderGalleryTable() {
      const tbody = document.getElementById('gallery-table-body');
      if (galleryData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No photos in gallery. Click "+ Upload New Photo" to add one.</td></tr>';
        return;
      }

      tbody.innerHTML = galleryData.map(item => `
        <tr>
          <td><img src="${item.image_url}" class="table-thumbnail" alt="Thumbnail"></td>
          <td><strong>${item.title || 'Untitled'}</strong></td>
          <td><span class="badge" style="background: var(--bg-subtle); color: var(--primary-deep);">${item.category}</span></td>
          <td>${item.display_order}</td>
          <td><span class="badge ${item.is_active ? 'badge-active' : 'badge-inactive'}">${item.is_active ? 'Active' : 'Hidden'}</span></td>
          <td>
            <button class="btn-action btn-edit" onclick="editGalleryItem(${item.id})">Edit</button>
            <button class="btn-action btn-delete" onclick="deleteGalleryItem(${item.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openGalleryModal(item = null) {
      document.getElementById('gallery-form').reset();
      document.getElementById('gallery_id').value = '';
      document.getElementById('gallery_image_url').value = '';
      document.getElementById('gallery-image-preview').style.display = 'none';

      if (item) {
        document.getElementById('gallery-modal-title').textContent = 'Edit Photo';
        document.getElementById('gallery_id').value = item.id;
        document.getElementById('gallery_title').value = item.title || '';
        document.getElementById('gallery_category').value = item.category || 'General';
        document.getElementById('gallery_description').value = item.description || '';
        document.getElementById('gallery_display_order').value = item.display_order || 0;
        document.getElementById('gallery_is_active').value = item.is_active ? 1 : 0;
        document.getElementById('gallery_image_url').value = item.image_url || '';
        if (item.image_url) {
          const img = document.getElementById('gallery-image-preview');
          img.src = item.image_url;
          img.style.display = 'block';
        }
      } else {
        document.getElementById('gallery-modal-title').textContent = 'Upload New Photo';
        document.getElementById('gallery_category').value = 'General';
      }

      openModal('gallery-modal');
    }

    function editGalleryItem(id) {
      const item = galleryData.find(g => g.id === id);
      if (item) openGalleryModal(item);
    }

    async function deleteGalleryItem(id) {
      if (!confirm('Are you sure you want to delete this photo?')) return;
      try {
        await apiRequest(`/admin/gallery/${id}`, 'DELETE');
        showAlert('gallery-alert-container', 'Photo deleted successfully.', 'success');
        loadGallery();
      } catch (err) {
        showAlert('gallery-alert-container', err.message || 'Failed to delete photo.');
      }
    }

    document.getElementById('gallery-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('gallery_id').value;

      try {
        let image_url = document.getElementById('gallery_image_url').value;
        const uploaded = await uploadFileHelper('gallery_image_file');
        if (uploaded) image_url = uploaded;

        if (!image_url) {
          alert('Please select a photo file to upload.');
          return;
        }

        const payload = {
          title: document.getElementById('gallery_title').value,
          category: document.getElementById('gallery_category').value,
          description: document.getElementById('gallery_description').value,
          display_order: parseInt(document.getElementById('gallery_display_order').value, 10) || 0,
          image_url: image_url,
          is_active: parseInt(document.getElementById('gallery_is_active').value, 10)
        };

        if (id) {
          await apiRequest(`/admin/gallery/${id}`, 'PUT', payload);
        } else {
          await apiRequest('/admin/gallery', 'POST', payload);
        }

        closeModal('gallery-modal');
        showAlert('gallery-alert-container', `Photo ${id ? 'updated' : 'uploaded'} successfully!`, 'success');
        loadGallery();
      } catch (err) {
        alert(err.message || 'Error saving photo.');
      }
    });

    document.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
</html>
