<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Settings - Admin CMS</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <h2>School CMS</h2>
      <span>ADMIN</span>
    </div>
    <nav class="admin-nav">
      <ul>
        <li><a href="/admin/index.html">📊 Dashboard</a></li>
        <li><a href="/admin/settings.html" class="active">⚙️ School Settings</a></li>
        <li><a href="/admin/pages.html">📄 Pages Content</a></li>
        <li><a href="/admin/notices.html">📢 Notices</a></li>
        <li><a href="/admin/events.html">📅 Events</a></li>
        <li><a href="/admin/faculty.html">👨‍🏫 Faculty</a></li>
        <li><a href="/admin/facilities.html">🏛️ Facilities</a></li>
        <li><a href="/admin/gallery.html">🖼️ Gallery</a></li>
        <li><a href="/admin/enquiries.html">📬 Enquiries Inbox</a></li>
      </ul>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <h1>School General Settings & Branding</h1>
      <div class="admin-user-info">
        <a href="/index.html" target="_blank" style="font-size: 0.85rem; color: var(--accent-terracotta);">🌐 View Live Site</a>
      </div>
    </header>

    <div class="admin-content">
      <div id="settings-alert-container"></div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h3>Edit General School Information</h3>
        </div>

        <form id="settings-form">
          <div class="form-group">
            <label for="school_name">School Name</label>
            <input type="text" id="school_name" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="tagline">School Tagline / Motto</label>
            <input type="text" id="tagline" class="form-control">
          </div>

          <div class="form-group">
            <label for="logo_file">School Logo</label>
            <input type="file" id="logo_file" class="form-control" accept="image/*">
            <input type="hidden" id="logo_url">
            <img id="logo-preview" class="upload-preview" alt="Logo Preview">
          </div>

          <div class="form-group">
            <label for="description">Short Description / Overview</label>
            <textarea id="description" class="form-control"></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label for="phone">Contact Phone Numbers</label>
              <input type="text" id="phone" class="form-control">
            </div>

            <div class="form-group">
              <label for="email">Contact Email Address</label>
              <input type="email" id="email" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label for="address">Full Postal Address</label>
            <textarea id="address" class="form-control" style="min-height: 80px;"></textarea>
          </div>

          <div class="form-group">
            <label for="timings">School Operating Timings</label>
            <input type="text" id="timings" class="form-control" placeholder="e.g. Mon-Fri: 8:00 AM - 3:30 PM">
          </div>

          <div class="form-group">
            <label for="map_iframe_url">Google Maps Embed URL / iFrame Src</label>
            <input type="text" id="map_iframe_url" class="form-control" placeholder="https://www.google.com/maps/embed?pb=...">
          </div>

          <div class="admin-card-header" style="margin-top: 30px;">
            <h3>Social Media Links</h3>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label for="facebook_url">Facebook URL</label>
              <input type="url" id="facebook_url" class="form-control">
            </div>

            <div class="form-group">
              <label for="twitter_url">Twitter / X URL</label>
              <input type="url" id="twitter_url" class="form-control">
            </div>

            <div class="form-group">
              <label for="instagram_url">Instagram URL</label>
              <input type="url" id="instagram_url" class="form-control">
            </div>

            <div class="form-group">
              <label for="youtube_url">YouTube Channel URL</label>
              <input type="url" id="youtube_url" class="form-control">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Save Settings</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    async function loadSettings() {
      try {
        const res = await apiRequest('/public/settings');
        if (res.data) {
          const s = res.data;
          document.getElementById('school_name').value = s.school_name || '';
          document.getElementById('tagline').value = s.tagline || '';
          document.getElementById('description').value = s.description || '';
          document.getElementById('phone').value = s.phone || '';
          document.getElementById('email').value = s.email || '';
          document.getElementById('address').value = s.address || '';
          document.getElementById('timings').value = s.timings || '';
          document.getElementById('map_iframe_url').value = s.map_iframe_url || '';
          document.getElementById('facebook_url').value = s.facebook_url || '';
          document.getElementById('twitter_url').value = s.twitter_url || '';
          document.getElementById('instagram_url').value = s.instagram_url || '';
          document.getElementById('youtube_url').value = s.youtube_url || '';
          document.getElementById('logo_url').value = s.logo_url || '';

          if (s.logo_url) {
            const img = document.getElementById('logo-preview');
            img.src = s.logo_url;
            img.style.display = 'block';
          }
        }
      } catch (err) {
        showAlert('settings-alert-container', 'Failed to load school settings.');
      }
    }

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert('settings-alert-container');

      try {
        let logo_url = document.getElementById('logo_url').value;
        const uploadedLogo = await uploadFileHelper('logo_file');
        if (uploadedLogo) logo_url = uploadedLogo;

        const payload = {
          school_name: document.getElementById('school_name').value,
          tagline: document.getElementById('tagline').value,
          logo_url: logo_url,
          description: document.getElementById('description').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          address: document.getElementById('address').value,
          timings: document.getElementById('timings').value,
          map_iframe_url: document.getElementById('map_iframe_url').value,
          facebook_url: document.getElementById('facebook_url').value,
          twitter_url: document.getElementById('twitter_url').value,
          instagram_url: document.getElementById('instagram_url').value,
          youtube_url: document.getElementById('youtube_url').value
        };

        const res = await apiRequest('/admin/settings', 'PUT', payload);
        if (res.success) {
          showAlert('settings-alert-container', 'School settings updated successfully!', 'success');
          loadSettings();
        }
      } catch (err) {
        showAlert('settings-alert-container', err.message || 'Failed to update settings.');
      }
    });

    document.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
